            <!-- Header Upper -->

            </div>

            <!-- Sticky Header  -->

        <!-- Service Detail Section -->

                            <div id="photo-gallery" class="two-column row">

                            </div>
                        </div>

                    <!--Sidebar Side-->
                    <div class="sidebar-side col-lg-4 col-md-12 col-sm-12">

        <!-- Main Footer -->
        <footer class="main-footer">

                <div class="widgets-section">
                    <div class="auto-container">
                        <div class="row">
                            <!--Footer Column-->

                                <div class="footer-widget about-widget">
                                    <div class="footer-logo">
                                        <figure class="image"><a href="../index.html"><img src="../assets/images/logos/company/LAKE_GROUP_LOGO.jpg" alt="Alt Group" width="200px;"></a></figure>
                                    </div>
                                    <div class="widget-content">

                                            Lake Group is one of East and Central Africa's fastest growing energy trading and transportation conglomerates.
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="footer-column col-xl-3 col-lg-3 col-md-6 col-sm-12">

                                    <div class="widget-content quick-links">

                                    </div>
                                </div>
                            </div>

                                <div class="footer-widget contact-widget">
                                    <h2 class="widget-title">Contact Info</h2>
                                    <div class="widget-content contact-list-container">
                                        <!-- HANDLEBAR TEMPLATE INSERT (CONTACT INFO) -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!--Bottom-->
                <div class="footer-bottom">
                    <div class="auto-container">

                            </div>
                            <div class="bottom-column col-md-6 col-sm-12">
                                <ul class="footer-links clearfix">
                                    <li><a href="#">Terms of Service</a></li>
                                    <li><a href="#">Privacy Policy</a></li>
                                </ul>
                            </div>
                        </div>
                        
                        <!--Scroll to top-->
                        <div class="scroll-to-top scroll-to-target" data-target="html"><span class="icon flaticon-right-arrow"></span></div>

                    </div>

    </div>

<!-- HANDLEBAR TEMPLATE -->

<!-- LOGO -->
<script id="logo-template" type="text/x-handlebars-template">
    <a href="../index.html">
        <img src="{{data.logo}}" width="183" height="50" alt="{{data.company_name}}" title="{{data.company_name}}">
    </a>
</script>

<!-- Nav List -->
<script id="nav-list-template" type="text/x-handlebars-template">
    <li><a href="../index.html">Lake Group</a></li>
    <li><a href="index.html?country={{countryCode}}" class="company-name">{{data.company_name}}</a></li>
    <li class="current"><a href="gallery.html?country={{countryCode}}">Gallery</a></li>
    <li><a href="contact.html?country={{countryCode}}">Contact</a></li>
</script>

<!-- Banner -->
<script id="banner-template" type="text/x-handlebars-template">
    <section class="page-title" style="background-image:url({{data.bannerImage}});">
        <div class="auto-container">
            <div class="inner-container clearfix">
                <div class="title-box">
                    <h1 class="company-name">{{data.company_name}}</h1>
                    <span class="title">{{data.slogan}}</span>
                </div>
                <ul class="bread-crumb clearfix">
                    <li><a href="../index.html">Lake Group</a></li>
                    <li class="company-name">{{data.company_name}}</li>
                </ul>
            </div>
        </div>
    </section>
</script>

<!-- Gallery -->
<script id="gallery-template" type="text/x-handlebars-template">
    <div class="text-column col-lg-6 col-md-12 col-sm-12">
        {{#each data.galleryImages.leftSec}}
        <figure class="image gallery-image">
            <a href="{{this}}" class="lightbox-image" data-fancybox="images">
                <img src="{{this}}" alt="">
            </a>
        </figure>
        <br />
        {{/each}}
    </div>
    <div class="image-column col-lg-6 col-md-12 col-sm-12">
        {{#each data.galleryImages.rightSec}}
        <figure class="image">
            <a href="{{this}}" class="lightbox-image" data-fancybox="images">
                <img src="{{this}}" alt="">
            </a>
        </figure>
        <br />
        {{/each}}
    </div>
</script>

<!-- Brochure and Contact -->
<script id="brochure-contact-template" type="text/x-handlebars-template">
    <!--Brochure-->
    <div class="sidebar-widget links-box">
            <div class="brochure-link">
                <span class="icon flaticon-pdf"></span>
                <h5><a href="{{data.brocherURL}}">Download.pdf from here</a></h5>
                <span class="cat">Marketing Brochure</span>
            </div>
        </div>

        <!-- Contact Us -->
        <div class="sidebar-widget brochure">
            <div class="brochure-box">
                <h6>Need Help<span>?</span></h6>
                <p>Get in touch with us.</p>
                <ul class="info-box">
                    <li><span class="icon fa fa-envelope"></span> <a href="mailto:{{data.contact.email}}">{{data.contact.email}}</a></li>
                    {{#each data.contact.phone}}
                    <li><a href="tel:{{this}}"><span class="icon fa fa-phone"></span>{{this}}</a></li>
                    {{/each}}
                </ul>
                <a href="contact.html?country={{countryCode}}" class="theme-btn btn-style-one">Contact Us</a>
            </div>
        </div>
</script>

<!-- Footer Quick Links -->
<script id="quick-links-template" type="text/x-handlebars-template">
    <ul class="list">
            <li><a href="../index.html">Lake Group</a></li>
            <li><a href="#" class="company-name">{{data.company_name}}</a></li>
            <li><a href="./gallery.html?country={{countryCode}}">Gallery</a></li>
            <li><a href="./contact.html?country={{countryCode}}">Contact</a></li>
        </ul>
</script>

<!-- Footer Contact Info -->
<script id="contact-info-template" type="text/x-handlebars-template">
    <ul class="contact-list">
        <li>{{data.contact.address}}</li>
        {{#each data.contact.phone}}
        <li><a href="tel:{{this}}">{{this}}</a></li>
        {{/each}}
        <li><a href="mailto:{{data.contact.email}}">{{data.contact.email}}</a></li>
    </ul>
</script>

<!-- END OF HANDLEBAR TEMPLATE -->

<script>
     $(function () {
        // Grab the template script
        var logoScript = $("#logo-template").html();
        var navListScript = $("#nav-list-template").html();
        var bannerScript = $("#banner-template").html();
        var galleryScript = $("#gallery-template").html();
        var brochureContactScript = $("#brochure-contact-template").html();
        var quickLinksScript = $("#quick-links-template").html();
        var contactInfoScript = $("#contact-info-template").html();

        // Compile the template
        var logoTemplate = Handlebars.compile(logoScript);
        var navListTemplate = Handlebars.compile(navListScript);
        var bannerTemplate = Handlebars.compile(bannerScript);
        var galleryTemplate = Handlebars.compile(galleryScript);
        var brochureContactTemplate = Handlebars.compile(brochureContactScript);
        var quickLinksTemplate = Handlebars.compile(quickLinksScript);
        var contactInfoTemplate = Handlebars.compile(contactInfoScript);

        // Define our data object
        var params = getUrlVars();
        var countryCode = params['country'] ? params['country'] : 'TA';
        var context={
            "countryCode": countryCode,
            "data": APP_CONFIG[countryCode].ACFS 
        };

        // Pass our data to the template
        var logoComplitedHTML = logoTemplate(context);
        var navListCompiledHTML = navListTemplate(context);
        var bannerCompiledHTML = bannerTemplate(context);
        var galleryCompiledHTML = galleryTemplate(context);
        var bochureContactCompiledHTML = brochureContactTemplate(context);
        var quickLinksCompiledHTML = quickLinksTemplate(context);
        var contactInfoCompiledHTML = contactInfoTemplate(context);

        // Add the compiled html to the page
        $('.logo').html(logoComplitedHTML);
        $('.navigation').html(navListCompiledHTML);
        $('#page-banner').html(bannerCompiledHTML);
        $('#photo-gallery').html(galleryCompiledHTML);
        $('.services-sidebar').html(bochureContactCompiledHTML);
        $('.quick-links').html(quickLinksCompiledHTML);
        $('.contact-list-container').html(contactInfoCompiledHTML);

     });
</script>
</body>
</html>
