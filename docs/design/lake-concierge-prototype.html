<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lake Concierge Prototype</title><style>
@font-face{font-family:Jost;src:url('../../assets/fonts/files/jost-latin-ext-400-normal.woff2')}@font-face{font-family:Jost;src:url('../../assets/fonts/files/jost-latin-ext-600-normal.woff2');font-weight:600}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(135deg,#eaf5f9,#fff 52%,#d7edf5);font-family:Jost,Arial;color:#16394b}.hero{height:100dvh;background:url('../../assets/images/aviation/lake-aviation-hero.jpg') center/cover;opacity:.75}.launch{position:fixed;right:28px;bottom:28px;width:56px;height:56px;border:0;border-radius:50%;background:#0181BB;color:#fff;display:grid;place-items:center;box-shadow:0 16px 32px #013c5840;cursor:pointer}.launch svg{width:27px}.launch:hover svg{animation:wake .8s ease}.panel{position:fixed;right:28px;bottom:28px;width:440px;height:min(660px,calc(100dvh - 56px));max-height:none;background:#fff;border-radius:22px;box-shadow:0 28px 70px #013c5830;overflow:hidden;display:flex;flex-direction:column;animation:in .22s ease}.panel[hidden]{display:none}.head{height:63px;display:flex;align-items:center;justify-content:space-between;padding:0 15px 0 19px;border-bottom:1px solid #e4edf1}.head img{width:82px}.close{width:40px;height:40px;border:0;border-radius:11px;background:transparent;font-size:28px;color:#16394b;cursor:pointer}.close:hover{background:#edf6fa}.msgs{padding:22px 21px;display:flex;flex-direction:column;gap:18px;overflow:auto;background:#fbfdfe}.bot{font-size:15px;line-height:1.62;max-width:90%}.user{align-self:end;max-width:80%;background:#0181BB;color:#fff;border-radius:18px 18px 4px 18px;padding:11px 14px;font-size:15px;line-height:1.5}.link{color:#0181BB;font-size:13px;font-weight:600}.typing{display:flex;gap:5px;height:18px;align-items:center}.typing i{width:6px;height:6px;border-radius:50%;background:#0181BB;animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}.composer{margin:12px 14px 15px;border:1px solid #d2e0e6;border-radius:18px;display:flex;align-items:end;padding:6px;box-shadow:0 3px 10px #013c580a}.composer:focus-within{border-color:#0181BB;box-shadow:0 0 0 3px #0181bb18}textarea{flex:1;resize:none;border:0;outline:0;font:15px/1.5 Jost;padding:8px;max-height:96px}.send{width:40px;height:40px;border:0;border-radius:50%;background:#0181BB;color:#fff;font-size:21px;cursor:pointer}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes wake{50%{transform:translateY(-2px)}}@keyframes dot{50%{opacity:.35;transform:translateY(-3px)}}@media(max-width:600px){.panel{right:0;bottom:0;width:100%;max-height:88dvh;border-radius:22px 22px 0 0}.launch{right:16px;bottom:16px}}
</style></head><body><div class="hero"></div><button class="launch" aria-label="Open Lake"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3 6.7L3 21z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></button><section class="panel" hidden><header class="head"><img src="../../assets/images/logos/LAKE_LOGO_LAKE_ONLY.png" alt="Lake"><button class="close" aria-label="Close">×</button></header><main class="msgs"><div class="bot">Welcome to Lake. How can I help you today?</div><div class="bot">I can help with Lake Group companies, services and contact information.</div></main><form class="composer"><textarea rows="1" placeholder="Ask Lake..."></textarea><button class="send" aria-label="Send">↑</button></form></section><script>const q=s=>document.querySelector(s),p=q('.panel'),l=q('.launch'),m=q('.msgs'),t=q('textarea');function open(){p.hidden=false;l.hidden=true;t.focus()}function shut(){p.hidden=true;l.hidden=false}l.onclick=open;q('.close').onclick=shut;document.addEventListener('pointerdown',e=>{if(!p.hidden&&!p.contains(e.target)&&e.target!==l)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});t.oninput=()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,96)+'px'};q('form').onsubmit=e=>{e.preventDefault();let v=t.value.trim();if(!v)return;m.insertAdjacentHTML('beforeend','<div class="user">'+v+'</div><div class="typing"><i></i><i></i><i></i></div>');t.value='';setTimeout(()=>{q('.typing').remove();m.insertAdjacentHTML('beforeend','<div class="bot">Lake Aviation provides aviation fuel supply and into-plane fuelling services in Tanzania and Uganda.<br><a class="link" href="../../lake-aviation.html">View Lake Aviation →</a></div>');m.scrollTop=m.scrollHeight},750)}</script></body></html>
